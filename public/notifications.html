<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notifications Center - NovaBank Digital Banking System">
  <title>Notifications - NovaBank</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🏛️</div>
        <div class="brand-text">
          <h2>NovaBank</h2>
          <span>Digital Portal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/transfer.html" class="nav-link">
          <span class="nav-icon">💸</span>
          <span>Transfer Money</span>
        </a>
        <a href="/transactions.html" class="nav-link">
          <span class="nav-icon">📜</span>
          <span>Transactions</span>
        </a>
        <a href="/beneficiaries.html" class="nav-link">
          <span class="nav-icon">👥</span>
          <span>Beneficiaries</span>
        </a>
        <a href="/notifications.html" class="nav-link active">
          <span class="nav-icon">🔔</span>
          <span>Notifications</span>
          <span class="nav-badge notif-badge-count" style="display: none;">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <div class="user-avatar user-avatar-initials">--</div>
          <div class="user-info">
            <div class="user-name user-display-name">Loading...</div>
            <div class="user-role-badge user-display-role">customer</div>
          </div>
          <button class="btn-logout btn-logout-action" title="Logout">🚪</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-nav-toggle">☰</button>
          <div class="page-title">
            <h1>Notifications Center</h1>
            <p>Real-time security alerts, transfer updates, and account status notices</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-secondary btn-sm" id="btn-mark-all-read">✓ Mark All as Read</button>
        </div>
      </header>

      <main class="content-area" style="max-width: 900px;">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">🔔 Recent Alerts & Updates</h2>
            <span id="unread-status-badge" class="badge badge-info">All caught up</span>
          </div>

          <div id="notifications-list" style="display: flex; flex-direction: column; gap: 12px;">
            <div style="text-align: center; color: var(--text-dim); padding: 40px;">
              Loading notifications...
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
