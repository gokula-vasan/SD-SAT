<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register an account with NovaBank Digital Banking System">
  <title>Open Account - NovaBank</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">🏛️</div>
        <h2>Open an Account</h2>
        <p>Get a simulated bank account with ₹10,000.00 balance instantly</p>
      </div>

      <div id="register-alert" class="alert alert-danger" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
          <div class="form-hint">Must be at least 8 characters long.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-register-submit" style="width: 100%; padding: 12px; margin-top: 8px;">
          Create My Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Sign In</a>
      </div>
      <div style="text-align: center; margin-top: 10px; font-size: 0.82rem;">
        <a href="/index.html" style="color: var(--text-dim);">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
